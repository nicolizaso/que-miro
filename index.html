<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Qué Miro? — Tu biblioteca de películas y series</title>
    <meta
      name="description"
      content="Llevá el registro de lo que querés ver, lo que estás viendo y lo que ya terminaste. Con reseñas propias y un selector aleatorio para cuando no sabés qué mirar."
    />

    <!-- Playfair Display: es la tipografía de los títulos definida en index.css.
         Sin este preload la app cae al serif del sistema y pierde su identidad. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/pwa-192x192.png" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Qué Miro?" />
    <meta
      property="og:description"
      content="Tu biblioteca personal de películas y series, con reseñas y selector aleatorio."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qué Miro?" />
    <meta
      name="twitter:description"
      content="Tu biblioteca personal de películas y series, con reseñas y selector aleatorio."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0D0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Qué Miro?" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Aplica el tema guardado antes del primer pintado. Sin esto, quien tiene
         elegido el tema claro ve un fogonazo oscuro hasta que React monta.
         Lee el mismo storage que el store de preferencias (zustand/persist). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('que-miro-preferences');
          var theme = saved ? JSON.parse(saved).state.theme : 'system';
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
          var isDark =
            theme === 'dark' ||
            (theme !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', isDark ? '#0b0d0e' : '#faf8f5');
        } catch (e) {
          /* Sin storage (modo privado, storage bloqueado) queda el tema del sistema. */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
